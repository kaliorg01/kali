version: '3.8'

services:
  aura:
    build: .
    container_name: aura
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      - PORT=3333
      - HOST=0.0.0.0
      - NODE_ENV=production
      - AURA_DB=/app/dados/aura.db
      - AURA_AUDIOS=/app/dados/audios
      - LOG_LEVEL=info
    volumes:
      - ./dados:/app/dados
