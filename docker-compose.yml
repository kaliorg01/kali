version: '3.8'

services:
  kali:
    build: .
    container_name: kali
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      - PORT=3333
      - HOST=0.0.0.0
      - NODE_ENV=production
      - KALI_DB=/app/dados/kali.db
      - KALI_AUDIOS=/app/dados/audios
      - LOG_LEVEL=info
    volumes:
      - ./dados:/app/dados
