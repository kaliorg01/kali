<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KALI</title>
<link rel="icon" type="image/png" href="/img/icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
<script>try{var t=localStorage.getItem('kali-tema')||localStorage.getItem('aura-tema');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="neb n1"></div><div class="neb n2"></div><div class="neb n3"></div>
<div class="app" id="app">
  <nav class="rail" id="rail" aria-label="Servidores"></nav>
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
  <aside class="membros" id="membros" aria-label="Membros"></aside>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="conexao" id="conexao" hidden>Reconectando…</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/voz.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
