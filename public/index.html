<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KALI</title>
<link rel="icon" type="image/png" href="/img/icone.png">
<link rel="apple-touch-icon" href="/img/icone-180.png">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KALI">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/cinema.css">
<link rel="stylesheet" href="/css/visual.css">
<script>try{var t=localStorage.getItem('kali-tema')||localStorage.getItem('aura-tema');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;var a=localStorage.getItem('kali-acento');if(a===null)a='rosa';if(localStorage.getItem('kali-efeitos')!=='1')document.documentElement.setAttribute('data-leve','');var fo=localStorage.getItem('kali-fonte');if(fo==='redonda'||fo==='mono')document.documentElement.dataset.fonte=fo;var fu=localStorage.getItem('kali-fundo');if(fu==='grade'||fu==='estrelas'||fu==='aurora')document.documentElement.dataset.fundo=fu;if(a==='rosa'||a==='roxo'||a==='verde')document.documentElement.dataset.acento=a}catch(e){}</script>
</head>
<body>
<div class="neb n1"></div><div class="neb n2"></div><div class="neb n3"></div>
<div class="app" id="app">
  <nav class="rail" id="rail" aria-label="Servidores"></nav>
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
  <aside class="membros" id="membros" aria-label="Membros"></aside>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="conexao" id="conexao" hidden>Reconectando…</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/voz.js"></script>
<script src="/js/app.js"></script>
<script src="/js/cinema.js"></script>
</body>
</html>
