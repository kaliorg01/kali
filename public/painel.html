<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do dono — KALI</title>
<link rel="icon" type="image/png" href="/img/icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
<style>
  body.painel{overflow:auto;min-height:100vh}
  .painel-wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:16px}
  .painel-topo{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .painel-topo img{width:40px;height:40px;border-radius:10px}
  .painel-topo h1{font-family:var(--mono);font-size:20px;letter-spacing:.12em;flex:1}
  .painel-topo a{color:var(--suave);font-size:13px}
  .bloco{border:1px solid var(--borda);background:var(--card);border-radius:18px;padding:16px}
  .bloco h2{font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--fraco);margin-bottom:12px}
  .numeros{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .numero{border:1px solid var(--borda);border-radius:14px;padding:12px;background:var(--chip)}
  .numero b{display:block;font-size:26px;font-family:var(--mono)}
  .numero small{color:var(--suave)}
  .usuario-linha{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--borda-fina);flex-wrap:wrap}
  .usuario-linha .nome{flex:1;min-width:140px}
  .usuario-linha small{color:var(--fraco)}
  .itens-usuario{width:100%;display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 6px}
  .itens-usuario .chip{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:999px;border:1px solid var(--chip-borda);background:var(--chip);font-size:12px}
  .aviso-painel{text-align:center;padding:60px 16px;color:var(--suave)}

  /* ---------- animação ---------- */
  body.painel{background:#000}
  .fundo{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .fundo .grade{position:absolute;inset:-50%;background-image:linear-gradient(rgba(54,123,240,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(54,123,240,.09) 1px,transparent 1px);background-size:44px 44px;transform:perspective(600px) rotateX(58deg);animation:grade 8s linear infinite;mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 70%)}
  @keyframes grade{to{background-position:0 44px,0 0}}
  .fundo .bolha{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;animation:flutua 14s ease-in-out infinite alternate}
  .fundo .b1{width:520px;height:520px;background:#1f5fd6;left:-120px;top:-160px}
  .fundo .b2{width:420px;height:420px;background:#0e7490;right:-100px;top:30%;animation-duration:18s}
  .fundo .b3{width:360px;height:360px;background:#2fd0ff;left:30%;bottom:-200px;opacity:.18;animation-duration:22s}
  @keyframes flutua{to{transform:translate(90px,70px) scale(1.2)}}
  .fundo .pt{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:#2fd0ff;box-shadow:0 0 8px #2fd0ff;animation:sobe linear infinite}
  @keyframes sobe{to{transform:translateY(-110vh);opacity:0}}
  .painel-topo h1{background:linear-gradient(90deg,#f2f4f8,#2fd0ff,#5a9cff,#f2f4f8);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brilho 5s linear infinite}
  .painel-topo h1::after{content:"_";color:#3ee6a8;-webkit-text-fill-color:#3ee6a8;animation:pisca 1s steps(1) infinite}
  .painel-topo img{animation:respira 3s ease-in-out infinite}
  @keyframes respira{50%{transform:scale(1.08) rotate(-4deg);filter:drop-shadow(0 0 12px rgba(47,208,255,.7))}}
  .bloco,.painel-topo{opacity:0;transform:translateY(24px) scale(.98);animation:entra .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0) * 110ms)}
  @keyframes entra{to{opacity:1;transform:none}}
  .bloco{position:relative;overflow:hidden;isolation:isolate;transition:transform .25s,box-shadow .25s}
  .bloco::before{content:"";position:absolute;inset:-2px;z-index:-1;background:conic-gradient(from var(--a,0deg),transparent 0 70%,#2fd0ff 80%,#1f5fd6 90%,transparent);animation:gira 4s linear infinite;opacity:.0;transition:opacity .3s}
  .bloco::after{content:"";position:absolute;inset:1px;z-index:-1;border-radius:17px;background:rgba(14,15,19,.94)}
  .bloco:hover{transform:translateY(-3px);box-shadow:0 18px 50px rgba(31,95,214,.25)}
  .bloco:hover::before{opacity:1}
  @property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
  @keyframes gira{to{--a:360deg}}
  .bloco h2::before{content:"▸ ";color:#2fd0ff;display:inline-block;animation:seta 1.6s ease-in-out infinite}
  @keyframes seta{50%{transform:translateX(4px)}}
  .numero{position:relative;overflow:hidden;opacity:0;animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:calc(300ms + var(--i,0) * 90ms);transition:transform .2s,border-color .2s}
  .numero:hover{transform:translateY(-4px) scale(1.03);border-color:#2fd0ff}
  .numero::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(47,208,255,.18) 50%,transparent 70%);transform:translateX(-100%);animation:varre 3.5s ease-in-out infinite;animation-delay:calc(var(--i,0) * 400ms)}
  @keyframes varre{60%,100%{transform:translateX(100%)}}
  @keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
  .numero.online b{color:#3ee6a8}
  .numero.online small::before{content:"";display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;background:#3ee6a8;box-shadow:0 0 0 0 rgba(62,230,168,.7);animation:ping 1.6s infinite}
  @keyframes ping{70%{box-shadow:0 0 0 10px rgba(62,230,168,0)}100%{box-shadow:0 0 0 0 rgba(62,230,168,0)}}
  .numero b.subiu{animation:sobeNum .6s}
  @keyframes sobeNum{40%{transform:scale(1.25);color:#2fd0ff}}
  .item-loja{opacity:0;animation:pop .45s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:calc(var(--i,0) * 70ms);transition:transform .2s,box-shadow .2s,border-color .2s;overflow:hidden}
  .item-loja:hover{transform:translateY(-6px) rotate(-1deg);border-color:#2fd0ff;box-shadow:0 14px 34px rgba(47,208,255,.22)}
  .item-loja::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%);transform:translateX(-120%);transition:transform .7s}
  .item-loja:hover::after{transform:translateX(120%)}
  .bt{position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s}
  .bt:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(54,123,240,.35)}
  .bt:active{transform:scale(.96)}
  .bt.prim{background-size:200% 100%;animation:fluxo 4s linear infinite}
  @keyframes fluxo{to{background-position:200% 0}}
  .usuario-linha{opacity:0;animation:entra .45s ease forwards;animation-delay:calc(var(--i,0) * 50ms);transition:background .2s,padding-left .2s;border-radius:10px}
  .usuario-linha:hover{background:var(--hover);padding-left:12px}
  .linha-form input:focus,.linha-form select:focus{border-color:#2fd0ff;box-shadow:0 0 0 3px rgba(47,208,255,.18);outline:0;transition:box-shadow .2s}
  .toast{animation:toastIn .35s cubic-bezier(.3,1.4,.5,1)}
  @keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.9)}}
  /* Reduzir movimento: tira grade 3D, partículas e flutuação; mantém brilhos e esmaecer */
  @media (prefers-reduced-motion:reduce){.fundo .grade,.fundo .bolha,.fundo .pt,.painel-topo img{animation:none!important}.bloco,.painel-topo,.numero,.item-loja,.usuario-linha{animation-name:soEsmaece!important}.bloco:hover,.numero:hover,.item-loja:hover,.bt:hover{transform:none!important}}
  @keyframes soEsmaece{from{opacity:0}to{opacity:1}}
/* rascunhos de banner */
.rasc-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;margin-top:10px}
.rasc-card{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);transition:transform .2s,opacity .3s,border-color .2s;animation:entra .4s both;animation-delay:calc(var(--i) * 40ms)}
.rasc-card:hover{transform:translateY(-3px);border-color:#ff4fb8}
.rasc-card.saindo{opacity:0;transform:scale(.95)}
.rasc-card img{width:100%;aspect-ratio:3/1;object-fit:cover;display:block;background:#000}
.rasc-info{display:flex;flex-direction:column;gap:6px;padding:10px 12px 4px}
.rasc-info input{width:100%}
.rasc-linha{display:flex;align-items:center;gap:6px}
.rasc-linha input{width:90px;flex:none}
.rasc-acoes{display:flex;gap:6px;padding:8px 12px 12px}
.rasc-acoes .bt.prim{flex:1}
@keyframes entra{from{opacity:0;transform:translateY(8px)}}
</style>
</head>
<body class="painel">
<div class="fundo" id="fundo"><div class="grade"></div><div class="bolha b1"></div><div class="bolha b2"></div><div class="bolha b3"></div></div>
<div class="painel-wrap" id="painel"><p class="aviso-painel">Carregando…</p></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script src="/js/painel.js"></script>
</body>
</html>
