<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do dono — KALI</title>
<link rel="icon" type="image/png" href="/img/icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
<style>
  body.painel{overflow:auto;min-height:100vh}
  .painel-wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:16px}
  .painel-topo{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .painel-topo img{width:40px;height:40px;border-radius:10px}
  .painel-topo h1{font-family:var(--mono);font-size:20px;letter-spacing:.12em;flex:1}
  .painel-topo a{color:var(--suave);font-size:13px}
  .bloco{border:1px solid var(--borda);background:var(--card);border-radius:18px;padding:16px}
  .bloco h2{font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--fraco);margin-bottom:12px}
  .numeros{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .numero{border:1px solid var(--borda);border-radius:14px;padding:12px;background:var(--chip)}
  .numero b{display:block;font-size:26px;font-family:var(--mono)}
  .numero small{color:var(--suave)}
  .usuario-linha{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--borda-fina);flex-wrap:wrap}
  .usuario-linha .nome{flex:1;min-width:140px}
  .usuario-linha small{color:var(--fraco)}
  .itens-usuario{width:100%;display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 6px}
  .itens-usuario .chip{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:999px;border:1px solid var(--chip-borda);background:var(--chip);font-size:12px}
  .aviso-painel{text-align:center;padding:60px 16px;color:var(--suave)}
</style>
</head>
<body class="painel">
<div class="painel-wrap" id="painel"><p class="aviso-painel">Carregando…</p></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script src="/js/painel.js"></script>
</body>
</html>
