# Monta o app Android (KALI.apk) e publica no GitHub Releases, com link fixo:
#   https://github.com/kaliorg01/kali/releases/latest/download/KALI.apk
# Roda sozinho quando algo em android/ muda, ou na mão em Actions → "App Android" → Run workflow.
# Configure em Settings → Secrets and variables → Actions → Variables:  KALI_URL = endereço do servidor (ex.: https://kali.seudominio.com)
# Opcional (pra atualizar o app sem desinstalar): secrets KEYSTORE_BASE64, KEYSTORE_SENHA, KEY_ALIAS, KEY_SENHA.
name: App Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Montar APK
        working-directory: android
        env:
          KALI_URL: ${{ vars.KALI_URL }}
          VERSAO_APP: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/kali.keystore
            gradle assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file=$PWD/app/kali.keystore \
              -Pandroid.injected.signing.store.password='${{ secrets.KEYSTORE_SENHA }}' \
              -Pandroid.injected.signing.key.alias='${{ secrets.KEY_ALIAS }}' \
              -Pandroid.injected.signing.key.password='${{ secrets.KEY_SENHA }}'
            cp app/build/outputs/apk/release/app-release.apk ../KALI.apk
          else
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../KALI.apk
          fi

      - name: Publicar no Releases (link fixo do botão "Baixar app")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: KALI pra Android (v1.${{ github.run_number }})
          body: |
            Baixe o **KALI.apk**, abra o arquivo no celular e permita instalar.
            Servidor: ${{ vars.KALI_URL || '(KALI_URL não configurado)' }}
          files: KALI.apk
          make_latest: true
